[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "Privacy-first AI assistant that understands your workday."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Thomas Hallberg" }
]

dependencies = [
    "psutil",
    "pywin32",
    "requests",
    "sqlalchemy",
]

[project.scripts]
kairos = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
ignore = [
    "DTZ001",
    "DTZ005",
    "DTZ011",
]